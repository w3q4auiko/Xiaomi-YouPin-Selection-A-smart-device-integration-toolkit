<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NexTech login</title>
    <link rel="icon" href="../img/login_logo.png">
    <link rel="stylesheet" href="../css/bootstrap.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/background.css" />
    <link rel="stylesheet" href="../css/form.css" />
  </head>
  <body>
    <!-- 加载动画 -->
    <div id="loading-icon" class="loading">
      <div class="preloader">
        <div class="preloader-body">
          <div class="cssload-container">
            <div class="cssload-speeding-wheel"></div>
          </div>
          <p>Loading...</p>
        </div>
      </div>
    </div>
    <!-- 加载结束 -->
    <!-- 登录开始 -->
    <div id="login" class="loading hidden">
      <div id="inall">
        <!-- 顶部链接 -->
        <div id="top">
          <a href="#" class="login active">登录</a>
          <a href="#" class="signup">注册</a>
        </div>
        <!-- 表单输入 -->
        <form
          id="loginForm"
          class="form-fade form-visible"
          method="post"
        >
          <div class="input-container">
            <input
              type="text"
              name="user"
              id="user"
              style="padding: 7px 0 0 17px"
            />
            <label for="user">账号</label>
          </div>
          <div class="input-container">
            <input type="password" name="password" id="password" />
            <label for="password">密码</label>
          </div>
          <input type="submit" value="登录" id="get"/>
          <!-- 底部链接 -->
          <div id="bot">
            <a href="find.html">忘记密码？</a>
          </div>
        </form>

        <form
          id="signupForm"
          class="form-fade hidden"
          action="signup.php"
          method="post"
        >
          <div class="input-container">
            <input
              type="text"
              name="username"
              id="username"
              style="padding: 7px 0 0 17px"
            />
            <label for="username">账号</label>
          </div>
          <div class="input-container">
            <input type="password" name="password1" id="password1" />
            <label for="password1">密码</label>
          </div>
          <div class="input-container">
            <input type="password" name="password2" id="password2" />
            <label for="password2">确认密码</label>
          </div>
          <input type="submit" value="注册" />
        </form>
      </div>
    </div>

    <!-- 登录结束 -->

    <!-- 背景动画容器 -->
    <div id="background"></div>

    <script>
      const container = document.getElementById("background");
      for (let i = 0; i < 24; i++) {
        const div = document.createElement("div");
        const span = document.createElement("span");
        div.appendChild(span);
        container.appendChild(div);
      }
    </script>
    <script src="../js/loading.js"></script>
  </body>
</html>
